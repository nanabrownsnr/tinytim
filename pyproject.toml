[project]
name = "tinytim"
version = "0.1.0"
description = "A production-shaped FastMCP server with a notes management MCP App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pydantic==2.12.4",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
